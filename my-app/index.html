<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ Remove the vite.svg line below — replaced by logo -->
    <!-- ❌ Delete this: <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Translate Widget -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,hi,pa",
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          "google_translate_element",
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <!-- ✅ Only this favicon line — logo -->
    <link
      rel="icon"
      type="image/png"
      href="/images/Shree_Ganesh_Traders_logo.png"
    />

    <title>Shree Ganesh Traders</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display: none"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
